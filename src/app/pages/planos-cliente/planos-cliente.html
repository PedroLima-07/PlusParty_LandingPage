<section class="section page-top">
  <div class="shell">
    <h1>Para você é grátis. Sempre.</h1>
    <p class="lead">
      Sem baixar aplicativo: abre no navegador do celular.
    </p>

    <div class="page-acoes">
      <a class="btn-party" [href]="destinos.descobrir">Ver os bares agora</a>
      <a class="link-quiet" [href]="destinos.entrar">Já tenho conta</a>
    </div>
  </div>
</section>

<section class="section faixa">
  <div class="shell">
    <article class="card plano is-top" revela>
      <h2 class="plano-nome">Rolê</h2>

      <p class="plano-preco">
        <span class="valor">R$ 0</span>
        <span class="periodo">sempre</span>
      </p>

      <ul class="plano-itens">
        @for (i of itens; track i) {
          <li>{{ i }}</li>
        }
      </ul>

      <a class="btn-party plano-cta" [href]="destinos.criarConta">Criar minha conta</a>
    </article>

    <p class="troca" revela>
      Tem um bar?
      <a routerLink="/planos/estabelecimento" class="link-quiet">
        Ver os planos para estabelecimentos
      </a>
    </p>
  </div>
</section>
